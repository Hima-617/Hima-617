<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="text-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 54px; letter-spacing: -1px; }
    .badge { font-weight: 600; font-size: 13px; letter-spacing: 2px; }
    .subtitle { font-weight: 400; font-size: 19px; fill: #94a3b8; }
    .tag { font-weight: 500; font-size: 13px; fill: #cbd5e1; }
  </style>

  <!-- Outer Canvas with Glow Border -->
  <rect x="6" y="6" width="1188" height="348" rx="20" fill="url(#bg-grad)" stroke="url(#border-glow)" stroke-width="2" />
  
  <!-- Subtle Background Grid Overlay -->
  <rect x="8" y="8" width="1184" height="344" rx="18" fill="url(#cyber-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.06" filter="url(#glow)"/>
  <circle cx="1050" cy="280" r="160" fill="#10b981" opacity="0.05" filter="url(#glow)"/>
  <circle cx="650" cy="180" r="180" fill="#818cf8" opacity="0.04" filter="url(#glow)"/>

  <!-- Code Window Controls (Top Left) -->
  <g transform="translate(45, 36)">
    <circle cx="0" cy="0" r="6" fill="#ef4444" />
    <circle cx="20" cy="0" r="6" fill="#f59e0b" />
    <circle cx="40" cy="0" r="6" fill="#10b981" />
    <text x="70" y="4" class="font-mono" font-size="12" fill="#64748b">~/portfolio/hima-617 &gt; echo $STATUS</text>
  </g>

  <!-- Status Indicator (Top Right) -->
  <g transform="translate(1010, 36)">
    <rect x="-10" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="4" cy="0" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="4" class="font-mono" font-size="11" fill="#34d399" font-weight="600">READY TO BUILD</text>
  </g>

  <!-- Role Badge -->
  <g transform="translate(45, 100)">
    <rect x="0" y="0" width="310" height="30" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="155" y="20" text-anchor="middle" class="font-mono badge" fill="#38bdf8">COMPUTER SCIENCE &amp; AI/ML</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(45, 180)">
    <text x="0" y="0" class="font-sans title" fill="url(#text-accent)">HIMAJA J</text>
  </g>

  <!-- Subtitle / Bio -->
  <g transform="translate(45, 222)">
    <text x="0" y="0" class="font-sans subtitle">
      Computer Science Undergraduate crafting intelligent deep learning architectures and robust full-stack software.
    </text>
  </g>

  <!-- Interactive / Decorative Badges Row -->
  <g transform="translate(45, 276)">
    <!-- Pill 1: Python & DL -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="36" rx="10" fill="url(#pill-grad)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="18" r="4" fill="#38bdf8"/>
      <text x="34" y="23" class="font-mono tag">Python &amp; PyTorch</text>
    </g>

    <!-- Pill 2: CNN / Medical Imaging -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="185" height="36" rx="10" fill="url(#pill-grad)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="18" r="4" fill="#818cf8"/>
      <text x="34" y="23" class="font-mono tag">Computer Vision (CNN)</text>
    </g>

    <!-- Pill 3: Full Stack & Streamlit -->
    <g transform="translate(385, 0)">
      <rect x="0" y="0" width="175" height="36" rx="10" fill="url(#pill-grad)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="18" r="4" fill="#34d399"/>
      <text x="34" y="23" class="font-mono tag">Streamlit &amp; Next.js</text>
    </g>

    <!-- Pill 4: Problem Solving -->
    <g transform="translate(575, 0)">
      <rect x="0" y="0" width="170" height="36" rx="10" fill="url(#pill-grad)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="18" r="4" fill="#fbbf24"/>
      <text x="34" y="23" class="font-mono tag">Data Structures &amp; Alg</text>
    </g>
  </g>

  <!-- Decorative Matrix / Code Glyphs (Right Side) -->
  <g transform="translate(930, 130)" opacity="0.6">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" class="font-mono" font-size="12" fill="#38bdf8">class Engineer:</text>
    <text x="35" y="54" class="font-mono" font-size="12" fill="#94a3b8">focus = <tspan fill="#34d399">"AI + Software"</tspan></text>
    <text x="35" y="76" class="font-mono" font-size="12" fill="#94a3b8">mode = <tspan fill="#818cf8">"High-Impact"</tspan></text>
    <text x="35" y="98" class="font-mono" font-size="12" fill="#94a3b8">daily_code = <tspan fill="#f59e0b">True</tspan></text>
    <text x="20" y="124" class="font-mono" font-size="12" fill="#38bdf8">himaja = Engineer()</text>
  </g>
</svg>
