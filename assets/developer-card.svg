<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>

    <pattern id="dot-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(56, 189, 248, 0.05)"/>
    </pattern>
  </defs>

  <style>
    .code-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; }
    .term-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748b; font-weight: 500; }
    .cmd { fill: #38bdf8; font-weight: 600; }
    .key { fill: #818cf8; font-weight: 600; }
    .str { fill: #34d399; }
    .val { fill: #f59e0b; }
    .comment { fill: #64748b; font-style: italic; }
  </style>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="846" height="246" rx="14" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5"/>
  <rect x="4" y="4" width="842" height="242" rx="12" fill="url(#dot-pattern)"/>

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="846" height="38" rx="14" fill="#0d1424" fill-opacity="0.8"/>
  <line x1="2" y1="40" x2="848" y2="40" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5.5" fill="#10b981"/>

  <text x="425" y="25" text-anchor="middle" class="term-title">himaja@workstation: ~/identity.json</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 68)" class="code-font">
    <!-- Prompt -->
    <text x="0" y="0">
      <tspan fill="#10b981">❯</tspan> <tspan class="cmd">cat</tspan> <tspan fill="#e2e8f0">developer_profile.json</tspan>
    </text>

    <!-- JSON Output -->
    <text x="0" y="26">
      <tspan fill="#94a3b8">{</tspan>
    </text>
    <text x="24" y="50">
      <tspan class="key">"name"</tspan><tspan fill="#94a3b8">: </tspan><tspan class="str">"Himaja J"</tspan><tspan fill="#94a3b8">,</tspan>
      <tspan dx="25" class="key">"role"</tspan><tspan fill="#94a3b8">: </tspan><tspan class="str">"CS Undergraduate &amp; Builder"</tspan><tspan fill="#94a3b8">,</tspan>
    </text>
    <text x="24" y="74">
      <tspan class="key">"focus_areas"</tspan><tspan fill="#94a3b8">: [</tspan><tspan class="str">"Artificial Intelligence"</tspan><tspan fill="#94a3b8">, </tspan><tspan class="str">"Machine Learning"</tspan><tspan fill="#94a3b8">, </tspan><tspan class="str">"Software Development"</tspan><tspan fill="#94a3b8">],</tspan>
    </text>
    <text x="24" y="98">
      <tspan class="key">"core_drive"</tspan><tspan fill="#94a3b8">: </tspan><tspan class="str">"Transforming computational algorithms into high-impact applications"</tspan><tspan fill="#94a3b8">,</tspan>
    </text>
    <text x="24" y="122">
      <tspan class="key">"daily_status"</tspan><tspan fill="#94a3b8">: </tspan><tspan class="str">"Practicing DSA • Training Models • Writing Clean Code"</tspan><tspan fill="#94a3b8">,</tspan>
      <tspan dx="20" class="key">"open_to_collaborate"</tspan><tspan fill="#94a3b8">: </tspan><tspan class="val">true</tspan>
    </text>
    <text x="0" y="146">
      <tspan fill="#94a3b8">}</tspan>
    </text>
  </g>
</svg>